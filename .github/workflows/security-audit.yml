name: Security audit

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix server
      - run: npm audit --audit-level=high --prefix feedback-layer
      - run: npm audit --audit-level=high --prefix mcp-server
      - run: npm audit --audit-level=high --prefix cli
      - run: npm audit --audit-level=high --prefix agent-loop
