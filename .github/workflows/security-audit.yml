name: Security audit

on:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: test ! -f package-lock.json || npm audit --audit-level=high --omit=dev
      - run: test ! -f server/package-lock.json || npm audit --audit-level=high --omit=dev --prefix server
      - run: test ! -f feedback-layer/package-lock.json || npm audit --audit-level=high --omit=dev --prefix feedback-layer
      - run: test ! -f mcp-server/package-lock.json || npm audit --audit-level=high --omit=dev --prefix mcp-server
      - run: test ! -f cli/package-lock.json || npm audit --audit-level=high --omit=dev --prefix cli
      - run: test ! -f agent-loop/package-lock.json || npm audit --audit-level=high --omit=dev --prefix agent-loop
